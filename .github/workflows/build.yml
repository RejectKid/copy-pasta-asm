name: Assembly builds and parity tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: brew install nasm
      - run: bash scripts/build-macos.sh --test
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: build/copy-pasta-asm
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Windows x64
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/copy-pasta-asm.exe
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm libgtk-3-dev libx11-dev libxtst-dev xvfb xdotool
      - run: bash scripts/build-linux.sh --test
      - name: Start the native UI in an isolated X11 display
        run: xvfb-run -a timeout 5 build/copy-pasta-asm || test "$?" = 124
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/copy-pasta-asm
