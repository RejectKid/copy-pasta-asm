name: Assembly builds and parity tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-macos.sh --test
      - run: python3 tests/history-parity.py build/copy-pasta-asm
      - run: python3 tests/macos-smoke.py
      - run: |
          python3 -m venv build/test-venv
          build/test-venv/bin/pip install pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ApplicationServices
          build/test-venv/bin/python tests/macos-integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64
          path: |
            build/copy-pasta-asm
            build/CopyPastaAsm-macos.zip
            build/ui.png
            build/integration-failure.png
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: brew install nasm
      - run: bash scripts/build-macos.sh --test
      - run: python3 tests/history-parity.py build/copy-pasta-asm
      - run: python3 tests/macos-smoke.py
      - run: |
          python3 -m venv build/test-venv
          build/test-venv/bin/pip install pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ApplicationServices
          build/test-venv/bin/python tests/macos-integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-x64
          path: |
            build/copy-pasta-asm
            build/CopyPastaAsm-macos.zip
            build/ui.png
            build/integration-failure.png
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Windows x64
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Test
      - run: python tests/history-parity.py build/copy-pasta-asm.exe
      - name: Test capture and typing on the disposable runner desktop
        run: python tests/windows-integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/copy-pasta-asm.exe
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm libgtk-3-dev libx11-dev libxtst-dev xvfb xdotool xterm xclip
      - run: bash scripts/build-linux.sh --test
      - run: python3 tests/history-parity.py build/copy-pasta-asm
      - name: Start the native UI in an isolated X11 display
        run: xvfb-run -a timeout 5 build/copy-pasta-asm || test "$?" = 124
      - name: Exercise capture and typing in an isolated X11 display
        run: xvfb-run -a bash tests/linux-integration.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/copy-pasta-asm
